<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crud-movies</title>
        <link rel="stylesheet" href="../css/estilos.css">
    </head>


<body>
    <!-- header -->
    <header class="header" >
        <nav class="navegacion">
            <a href="../index.html">
                <i class="fas fa-film" aria-hidden="true"></i>
                <span>Movieland</span>
            </a>
            <h3>CRUD de peliculas</h3>
        </nav>
    </header>

    <main id="main" class="main col">

    <section class="form_crud" >         
        <h3 id="title_form">Agregar Pelicula</h3>
        <!-- Formulario -->
        <form id="itemForm" >
                <div class="group_input">
                    <input type="text" id="id" name="id">

                    <div class="form-group">
                        <label for="name">Titulo:</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Fecha Lan:</label>
                        <input type="date" class="form-control" id="fecha_lanzamiento" name="fecha_lanzamiento" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Genero:</label>
                        <input type="text" class="form-control" id="genero" name="genero" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Duracion:</label>
                        <input type="text" class="form-control" id="duracion" name="duracion" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Directo:</label>
                        <input type="text" class="form-control" id="director" name="director" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Reparto:</label>
                        <input type="text" class="form-control" id="reparto" name="reparto" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Sinapsis:</label>
                        <input type="text" class="form-control" id="sinopsis" name="sinopsis" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="name">Imagen:</label>
                    <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                </div>                          

            
            <button type="submit" class="btn-primary" id="btn_submit">Guardar</button>
        </form>
        </section>

        <!-- Tabla -->
        <section class="sectionFormularioTabla" > 
        <h2>Peliculas</h2>
        <table class="table ">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titulo</th>
                    <th>Fecha Lan.</th>
                    <th>Genero</th>
                    <th>Duracion</th>
                    <th>Director</th>
                    <th>Reparto</th>
                    <th>Sinopsis</th>
                    <th colspan="2">Acciones</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody">
                <!-- Contenido generado dinámicamente -->
            </tbody>
        </table>
        </section>

    </main>

    <!-- footer -->
    <footer>
        <nav>
            <ul>
                <li ><a  href="">Términos y condiciones</a></li>
                <li ><a  href="">Preguntas frecuentes</a></li>
                <li ><a  href="">Ayuda</a></li>
                <li ><a  href="./pages/crud.html">Administrador Peliculas</a></li>
            </ul>
        </nav>
    </footer>
    <script src="../js/app.js"></script>
</body>
</html>
